<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MNA ESPORTS | Member Login</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #070a10;
            color: white;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            background: #0d111a;
            border: 1px solid #00e5ff;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.15);
        }

        h1 {
            text-align: center;
            color: #00e5ff;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #070a10;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #00e5ff;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #00e5ff;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: #ff6b6b;
        }
    </style>
</head>

<body>

<div class="login-box">

    <h1>MNA ESPORTS</h1>

    <div class="subtitle">Member Login</div>

    <form id="loginForm">

        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">LOGIN</button>

    </form>

    <div id="message"></div>

</div>

<script>
    const SUPABASE_URL = "https://awdzejrpxxvmbnybkwnp.supabase.co";

    const SUPABASE_KEY = "sb_publishable_OhGEakXHJYz7weGFS7ljTg_iPAHYasR";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    document.getElementById("loginForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const message = document.getElementById("message");

        message.style.color = "#aaa";
        message.textContent = "Logging in...";

        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            message.style.color = "#ff6b6b";
            message.textContent = error.message;
            return;
        }

        message.style.color = "#00e5ff";
        message.textContent = "Login successful!";

        /*
         * For now, we stay on this page.
         * After we confirm login works, we will add
         * the registration dashboard.
         */

    });
</script>

</body>
</html>
